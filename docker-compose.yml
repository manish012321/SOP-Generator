services:
  server:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - PORT=5000
      - CLIENT_URL=http://localhost

  client:
    build: ./client
    ports:
      - "80:80"
    depends_on:
      - server